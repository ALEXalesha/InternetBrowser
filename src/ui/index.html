<!doctype html>
<!-- Полоса вкладок, кнопки, адресная строка, панель закладок и поиск на странице.
     Страницы сайтов лежат под ней отдельными видами (WebContentsView), всплывающее - в overlay.html. -->
<html lang="ru" data-theme="glass">
<head>
  <meta charset="utf-8">
  <title>InternetBrowser</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header id="chrome">
    <div id="strip">
      <div id="tabs" role="tablist"></div>
      <button id="newtab" class="icon-btn small" data-tip="newTabButton"></button>
      <div class="drag"></div>
    </div>
    <div id="navbar">
      <button id="back" class="icon-btn" data-tip="back"></button>
      <button id="forward" class="icon-btn" data-tip="forward"></button>
      <button id="reload" class="icon-btn" data-tip="reload"></button>
      <div id="omni" class="field">
        <span id="omni-icon" class="omni-icon"></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" data-ph="addressPlaceholder" aria-label="address">
        <span id="zoom" class="chip" hidden></span>
        <button id="star" class="icon-btn small" data-tip="bookmarkAdd"></button>
      </div>
      <button id="shield" class="icon-btn shield" data-tip="shield"><span class="badge" id="blocked" hidden></span></button>
      <button id="downloads" class="icon-btn" data-tip="downloadsButton"><span class="dot" id="dl-dot" hidden></span></button>
      <button id="menu" class="icon-btn" data-tip="menu"></button>
    </div>
    <nav id="bar" hidden></nav>
    <div id="findbar" hidden>
      <div class="field find-field">
        <input id="find" type="text" spellcheck="false" autocomplete="off" data-ph="find">
        <span id="find-count" class="dim"></span>
      </div>
      <button id="find-prev" class="icon-btn small" data-tip="findPrev"></button>
      <button id="find-next" class="icon-btn small" data-tip="findNext"></button>
      <button id="find-close" class="icon-btn small" data-tip="close"></button>
    </div>
  </header>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
</body>
</html>
